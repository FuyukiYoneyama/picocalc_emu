name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Check generated board header
        run: python tools/generate_board_header.py --check
      - name: Verify portable fingerprints
        run: python tools/verify_environment.py
      - name: Run Python tests
        run: python -m unittest discover -s tests -v

  rp2040-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Fetch Pico SDK 2.0.0
        run: |
          git clone --branch 2.0.0 --depth 1 \
            https://github.com/raspberrypi/pico-sdk.git /tmp/pico-sdk
          git -C /tmp/pico-sdk submodule update --init --depth 1
      - name: Configure RP2040 template
        env:
          PICO_SDK_PATH: /tmp/pico-sdk
        run: |
          cmake -S templates/rp2040-basic -B build-ci \
            -DPICO_BOARD=pico \
            -DPICO_NO_PICOTOOL=1 \
            -DCMAKE_BUILD_TYPE=Release
      - name: Compile RP2040 template
        run: cmake --build build-ci -j2
